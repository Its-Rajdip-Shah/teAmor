<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprite Sheet Tester</title>
  <style>
    :root {
      --bg: #0d0d12;
      --panel: rgba(20, 24, 34, 0.92);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f2f5ff;
      --muted: #aab3c2;
      --accent: #2bd9a8;
      --accent-2: #ffd166;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Arial;
      overflow: hidden;
    }
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #game {
      position: absolute;
      inset: 0;
    }
    #ui {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 5;
      width: min(440px, 92vw);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 14px 14px 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
    }
    #ui h1 {
      font-size: 16px;
      margin: 0 0 10px;
      letter-spacing: 0.3px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row.full { grid-template-columns: 1fr; }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input[type="number"] { appearance: textfield; }
    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      background: #1e2431;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    button.primary { background: var(--accent); color: #0b1a14; }
    button.warn { background: var(--accent-2); color: #2a1c00; }
    button:active { transform: scale(0.98); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="game"></div>

  <div id="ui">
    <h1>Sprite Sheet Tester</h1>

    <div class="row full">
      <div>
        <label for="path">Sprite Sheet Path</label>
        <input id="path" value="spriteAssets/Stay angry.png" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="frameWidth">Frame Width</label>
        <input id="frameWidth" type="number" value="400" />
      </div>
      <div>
        <label for="frameHeight">Frame Height</label>
        <input id="frameHeight" type="number" value="400" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="columns">Columns</label>
        <input id="columns" type="number" value="4" />
      </div>
      <div>
        <label for="rows">Rows</label>
        <input id="rows" type="number" value="1" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="row">Row (0-based)</label>
        <input id="row" type="number" value="0" />
      </div>
      <div>
        <label for="fps">FPS</label>
        <input id="fps" type="number" value="12" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="startCol">Start Column</label>
        <input id="startCol" type="number" value="0" />
      </div>
      <div>
        <label for="endCol">End Column</label>
        <input id="endCol" type="number" value="3" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="scale">Scale</label>
        <input id="scale" type="number" step="0.1" value="1" />
      </div>
      <div>
        <label for="bg">Background</label>
        <select id="bg">
          <option value="#0d0d12">Dark</option>
          <option value="#f6f2ea">Light</option>
          <option value="#1a0e2a">Midnight</option>
        </select>
      </div>
    </div>

    <div class="btns">
      <button id="load" class="primary">Load Sheet</button>
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="stepBack">Step -1</button>
      <button id="stepForward">Step +1</button>
      <button id="leftRow" class="warn">Use Left Row</button>
      <button id="rightRow" class="warn">Use Right Row</button>
    </div>

    <div class="hint">Default: row 0 = walk left, row 1 = walk right. Press Load after edits.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
(() => {
  const ui = {
    path: document.getElementById('path'),
    frameWidth: document.getElementById('frameWidth'),
    frameHeight: document.getElementById('frameHeight'),
    columns: document.getElementById('columns'),
    rows: document.getElementById('rows'),
    row: document.getElementById('row'),
    fps: document.getElementById('fps'),
    startCol: document.getElementById('startCol'),
    endCol: document.getElementById('endCol'),
    scale: document.getElementById('scale'),
    bg: document.getElementById('bg'),
    load: document.getElementById('load'),
    play: document.getElementById('play'),
    pause: document.getElementById('pause'),
    stepBack: document.getElementById('stepBack'),
    stepForward: document.getElementById('stepForward'),
    leftRow: document.getElementById('leftRow'),
    rightRow: document.getElementById('rightRow')
  };

  const spriteConfig = {
    path: ui.path.value,
    frameWidth: 400,
    frameHeight: 400,
    columns: 4,
    rows: 1,
    row: 0,
    startCol: 0,
    endCol: 3,
    fps: 12,
    scale: 1
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function readConfig() {
    spriteConfig.path = ui.path.value.trim();
    spriteConfig.frameWidth = Math.max(1, Number(ui.frameWidth.value || 1));
    spriteConfig.frameHeight = Math.max(1, Number(ui.frameHeight.value || 1));
    spriteConfig.columns = Math.max(1, Number(ui.columns.value || 1));
    spriteConfig.rows = Math.max(1, Number(ui.rows.value || 1));
    spriteConfig.row = clamp(Number(ui.row.value || 0), 0, spriteConfig.rows - 1);
    spriteConfig.startCol = clamp(Number(ui.startCol.value || 0), 0, spriteConfig.columns - 1);
    spriteConfig.endCol = clamp(Number(ui.endCol.value || 0), spriteConfig.startCol, spriteConfig.columns - 1);
    spriteConfig.fps = clamp(Number(ui.fps.value || 12), 1, 60);
    spriteConfig.scale = clamp(Number(ui.scale.value || 1), 0.1, 8);

    ui.row.value = spriteConfig.row;
    ui.startCol.value = spriteConfig.startCol;
    ui.endCol.value = spriteConfig.endCol;
    ui.fps.value = spriteConfig.fps;
    ui.scale.value = spriteConfig.scale;
  }

  class MainScene extends Phaser.Scene {
    constructor() {
      super('main');
      this.sheetSprite = null;
    }

    preload() {
      this.loadSheet(true);
    }

    create() {
      window.__spriteScene = this;
      this.center = new Phaser.Math.Vector2(this.scale.width / 2, this.scale.height / 2);
      this.scale.on('resize', (gameSize) => {
        this.center.set(gameSize.width / 2, gameSize.height / 2);
        if (this.sheetSprite) this.sheetSprite.setPosition(this.center.x, this.center.y);
      });
      this.createSprite();
    }

    loadSheet(initial = false) {
      readConfig();
      const key = 'sheet';
      if (!initial && this.textures.exists(key)) {
        this.textures.remove(key);
      }
      const url = encodeURI(spriteConfig.path);
      this.load.spritesheet(key, url, {
        frameWidth: spriteConfig.frameWidth,
        frameHeight: spriteConfig.frameHeight
      });
      if (initial) return;
      this.load.once('complete', () => {
        this.createSprite();
      });
      this.load.start();
    }

    createSprite() {
      if (!this.textures.exists('sheet')) return;
      if (this.sheetSprite) this.sheetSprite.destroy();
      this.sheetSprite = this.add.sprite(this.center.x, this.center.y, 'sheet', 0);
      this.sheetSprite.setScale(spriteConfig.scale);
      this.updateAnimation(true);
    }

    updateAnimation(resetFrame = false) {
      if (!this.sheetSprite || !this.textures.exists('sheet')) return;
      const key = 'preview';
      if (this.anims.exists(key)) this.anims.remove(key);
      const start = spriteConfig.row * spriteConfig.columns + spriteConfig.startCol;
      const end = spriteConfig.row * spriteConfig.columns + spriteConfig.endCol;
      this.anims.create({
        key,
        frames: this.anims.generateFrameNumbers('sheet', { start, end }),
        frameRate: spriteConfig.fps,
        repeat: -1
      });
      this.sheetSprite.play(key);
      if (resetFrame) this.sheetSprite.setFrame(start);
    }

    play() {
      if (this.sheetSprite) this.sheetSprite.anims.resume();
    }

    pause() {
      if (this.sheetSprite) this.sheetSprite.anims.pause();
    }

    step(direction) {
      if (!this.sheetSprite) return;
      const total = spriteConfig.columns * spriteConfig.rows;
      const next = (this.sheetSprite.frame.name + direction + total) % total;
      this.sheetSprite.setFrame(next);
    }
  }

  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: ui.bg.value,
    scale: {
      mode: Phaser.Scale.RESIZE,
      width: window.innerWidth,
      height: window.innerHeight
    },
    scene: MainScene
  });

  function withScene(fn) {
    const scene = window.__spriteScene;
    if (scene) fn(scene);
  }

  ui.load.addEventListener('click', () => {
    withScene(scene => scene.loadSheet());
  });
  ui.play.addEventListener('click', () => {
    readConfig();
    withScene(scene => scene.updateAnimation());
  });
  ui.pause.addEventListener('click', () => {
    withScene(scene => scene.pause());
  });
  ui.stepBack.addEventListener('click', () => {
    readConfig();
    withScene(scene => scene.step(-1));
  });
  ui.stepForward.addEventListener('click', () => {
    readConfig();
    withScene(scene => scene.step(1));
  });
  ui.leftRow.addEventListener('click', () => {
    ui.row.value = 0;
    ui.startCol.value = 0;
    ui.endCol.value = Math.max(0, Number(ui.columns.value || 1) - 1);
  });
  ui.rightRow.addEventListener('click', () => {
    ui.row.value = 1;
    ui.startCol.value = 0;
    ui.endCol.value = Math.max(0, Number(ui.columns.value || 1) - 1);
  });
  ui.bg.addEventListener('change', () => {
    document.documentElement.style.setProperty('--bg', ui.bg.value);
    if (game.renderer && game.renderer.setClearColor) {
      game.renderer.setClearColor(ui.bg.value);
    } else if (game.canvas) {
      game.canvas.style.background = ui.bg.value;
    }
  });
})();
</script>
</body>
</html>
