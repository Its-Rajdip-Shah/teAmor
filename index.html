<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ciudad del amor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Satisfy&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap');
    :root {
      --bg: #0f1118;
      --panel: rgba(20, 24, 34, 0.9);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #aab3c2;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Arial;
      overflow: hidden;
    }
    #game {
      position: absolute;
      inset: 0;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 50px;
      z-index: 50;
    }
    #loader-content {
      position: relative;
      display: inline-block;
    }
    #game-title {
      position: fixed;
      left: 50%;
      top: 16px;
      transform: translateX(-50%) translateY(-6px);
      font-family: "Satisfy", cursive;
      text-align: center;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      padding: 12px 26px 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(10px) saturate(150%);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #game-title.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .game-title-main {
      font-size: clamp(28px, 5vw, 56px);
      color: #ff6fb7;
      text-shadow:
        -2px -2px 0 #c5122b,
        2px -2px 0 #c5122b,
        -2px 2px 0 #c5122b,
        2px 2px 0 #c5122b;
      letter-spacing: 1px;
      line-height: 1;
      white-space: nowrap;
    }
    .game-title-sub {
      margin-top: 4px;
      font-size: clamp(16px, 3vw, 28px);
      color: #ff85c2;
      text-shadow:
        -1px -1px 0 #c5122b,
        1px -1px 0 #c5122b,
        -1px 1px 0 #c5122b,
        1px 1px 0 #c5122b;
      letter-spacing: 0.5px;
      line-height: 1.1;
      white-space: nowrap;
    }
    #loader img {
      height: 87vh;
      width: auto;
      max-width: 90vw;
      display: block;
    }
    #start-btn {
      position: absolute;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: #1fd67a;
      color: #0b2a1d;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 22px;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 999px;
      border: 2px solid rgba(11, 42, 29, 0.25);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2), 0 0 14px rgba(31, 214, 122, 0.45);
      cursor: pointer;
      display: none;
    }
    #start-btn:hover {
      transform: translateX(-50%) scale(1.02);
    }
    #hud {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 5;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
    }
    #hud strong {
      color: var(--text);
      font-weight: 600;
    }
    #guy-bubble {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      padding: 10px 14px;
      background: rgba(220, 20, 60, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      color: #f5e44b;
      font-family: "Satisfy", cursive;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
      backdrop-filter: blur(14px) saturate(140%);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.18),
        0 0 0 2px rgba(255, 120, 150, 0.22),
        0 0 14px rgba(255, 120, 150, 0.3);
      z-index: 30;
      pointer-events: none;
      display: none;
      max-width: 360px;
    }
    #guy-bubble::after {
      content: "";
      position: absolute;
      left: 16px;
      top: 100%;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 14px solid rgba(220, 20, 60, 0.22);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.12)) drop-shadow(0 0 8px rgba(255, 120, 150, 0.25));
    }
    #girl-buttons {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      display: none;
      gap: 12px;
      z-index: 31;
      pointer-events: auto;
    }
    #girl-buttons img {
      width: 110px;
      height: auto;
      display: block;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
      transition: transform 0.15s ease;
    }
    #girl-buttons img:hover {
      transform: translateY(-2px) scale(1.02);
    }
    #end-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Pixelify Sans", sans-serif;
      font-size: 200px;
      color: #f5e44b;
      z-index: 2001;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      transition: opacity 0.4s ease;
    }
    #end-text.visible {
      opacity: 1;
    }
    .burn-out {
      animation: burnOut 0.6s ease forwards;
    }
    @keyframes burnOut {
      0% {
        opacity: 1;
        filter: blur(0px) saturate(140%);
        transform: translate(-50%, -100%) scale(1);
      }
      60% {
        opacity: 0.6;
        filter: blur(1.5px) saturate(200%);
        transform: translate(-50%, -100%) scale(1.03);
      }
      100% {
        opacity: 0;
        filter: blur(4px) saturate(240%);
        transform: translate(-50%, -100%) scale(1.08);
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loader">
    <div id="loader-content">
      <img id="loader-image" src="assets/loader page.png" alt="Loading" />
      <button id="start-btn" type="button">START</button>
    </div>
  </div>
  <div id="game-title" aria-hidden="true">
    <div class="game-title-main">ciudad del amor</div>
    <div class="game-title-sub">-welcome to my heart</div>
  </div>
  <div id="hud">Use <strong>WASD</strong> or <strong>←</strong> / <strong>→</strong> / <strong>↑</strong> / <strong>↓</strong>. Diagonal with <strong>↑</strong> + <strong>←/→</strong>.</div>
  <div id="guy-bubble" style="color: #ffffff;">
    damn so divine, <br /> 
    you must be nicotine,<br />
    be mine every valentine?<br /> 
    please don't decline
  </div>
  <div id="girl-buttons">
    <img id="btn-yes" src="buttons/yes button.png" alt="Yes" />
    <img id="btn-no" src="buttons/no button.png" alt="No" />
  </div>
  <div id="end-text"></div>

          this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,

          });

          }
          const stairsData = this.cache.json.get('stairs');
          if (stairsData && Array.isArray(stairsData.coords)) {
            this.stairsSet = new Set(stairsData.coords.map(([x, y]) => `${x},${y}`));
          }
          const stairsOppData = this.cache.json.get('stairsOpp');
          if (stairsOppData && Array.isArray(stairsOppData.coords)) {
            this.stairsSetOpp = new Set(stairsOppData.coords.map(([x, y]) => `${x},${y}`));

          const cam = this.cameras.main;

            .setScrollFactor(0)

            .setVisible(false);

            if (this.cutsceneActive || this.playerPoseLocked) {

              if (this.zoomTween) this.zoomTween.stop();
              this.applyGameplayCamera();

        applyLinearFiltering() {
          this.textures.each((texture) => {
            if (texture && typeof texture.setFilter === 'function') {
              texture.setFilter(Phaser.Textures.FilterMode.LINEAR);
            }
          });
        }

        update(time, delta) {
          if (!this.player) return;
          this.updateGuyBubble();
          this.updateGirlButtons();
          this.updateGuyWalkSfx();
          this.updateYesReverseSlide();
          if (this.noExitActive) {
            this.updateNoExit(delta);
            return;
          }
          if (this.cutsceneActive) {
            this.updateCutscene(delta);
            return;
          }
          if (this.playerPoseLocked) {
            this.updateWalkSfx(false);
            this.updateDogPrompt();
            return;
          }

          const warm = time < this.readyAt;
          const dt = warm ? (1 / 60) : Math.min(delta / 1000, 1 / 30);
          let inputX = 0;
          let inputY = 0;

          const leftDown = this.cursors.left.isDown || this.wasd.left.isDown;
          const rightDown = this.cursors.right.isDown || this.wasd.right.isDown;
          const downDown = this.cursors.down.isDown || this.wasd.down.isDown;
          const upDown = this.cursors.up.isDown || this.wasd.up.isDown;

          if (leftDown) inputX = -1;
          else if (rightDown) inputX = 1;
          if (downDown) inputY = 1;
          if (upDown) inputY = -1;

          if (inputX !== 0) this.facing = inputX;
          if (inputY !== 0) this.lastVertical = inputY;
          if (!this.promptClicksEnabled && (inputX !== 0 || inputY !== 0)) {
            this.promptClicksEnabled = true;
          }

          if (inputX !== 0 || inputY !== 0) {
            let moveX = inputX;
            let moveY = inputY;
            let speed = this.speed;

            const foot = this.getFootPosition(this.player.x, this.player.y);
            const onStairs = this.isOnStairs(this.stairsSet, foot.x, foot.y);
            const onStairsOpp = this.isOnStairs(this.stairsSetOpp, foot.x, foot.y);
            if (onStairs && inputX !== 0) {
              const dir = Math.sign(inputX);
              moveY += this.stairsBiasWeak * dir;
              speed *= dir > 0 ? this.stairsSpeedDown : this.stairsSpeedUp;
            } else if (onStairsOpp && inputX !== 0) {
              const dir = Math.sign(inputX);
              moveY -= this.stairsBiasStrong * dir;
              speed *= dir > 0 ? this.stairsSpeedUp : this.stairsSpeedDown;
            }

            const len = Math.hypot(moveX, moveY);
            moveX /= len;
            moveY /= len;
            const dx = moveX * speed * dt;
            const dy = moveY * speed * dt;
            const targetX = this.player.x + dx;
            const targetY = this.player.y + dy;

            if (this.canStandAt(targetX, targetY)) {
              this.player.x = targetX;
              this.player.y = targetY;
            } else {
              if (this.canStandAt(targetX, this.player.y)) this.player.x = targetX;
              if (this.canStandAt(this.player.x, targetY)) this.player.y = targetY;
            }
          }
          this.wrapPlayer();

          this.applyPlayerAnimation(inputX, inputY);
          this.updateWalkSfx(inputX !== 0 || inputY !== 0);
          this.updateDogPrompt();
        }

        updateYesReverseSlide() {
          if (!this.yesChoiceActive || this.yesReverseStartX === null || !this.guy) return;
          if (!this.guy.anims || !this.guy.anims.currentAnim) return;
          if (this.guy.anims.currentAnim.key !== GUY_PROPOSE_REV_KEY) return;
          const progress = typeof this.guy.anims.getProgress === 'function'
            ? this.guy.anims.getProgress()
            : 0;
          this.guy.x = this.yesReverseStartX - (this.yesReverseSlide * progress);
        }

        startCoupleScene() {
          if (!this.player || !this.guy || !this.couple) return;
          const girlBounds = this.getSpriteBounds(this.player);
          const guyBounds = this.getSpriteBounds(this.guy);
          const left = Math.min(girlBounds.left, guyBounds.left);
          const right = Math.max(girlBounds.right, guyBounds.right);
          const top = Math.min(girlBounds.top, guyBounds.top);
          const bottom = Math.max(girlBounds.bottom, guyBounds.bottom);
          const centerX = (left + right) / 2;
          const centerY = (top + bottom) / 2;
          const targetH = Math.max(1, bottom - top);
          const scale = targetH / COUPLE_FRAME_H;

          this.couple.setPosition(centerX, centerY);
          this.couple.setScale(scale);
          this.couple.setAlpha(0);
          this.couple.setVisible(true);
          this.couple.setTexture(COUPLE_KEY, 0);
          this.couple.play('couple-love');

          this.player.setVisible(false);
          this.guy.setVisible(false);

          this.tweens.add({
            targets: this.couple,
            alpha: 1,
            duration: 220,
            ease: 'Sine.easeOut'
          });
        }

        getSpriteBounds(sprite) {
          const frameW = sprite.frame ? sprite.frame.realWidth : 0;
          const frameH = sprite.frame ? sprite.frame.realHeight : 0;
          const w = frameW * sprite.scaleX;
          const h = frameH * sprite.scaleY;
          const left = sprite.x - w * sprite.originX;
          const right = left + w;
          const top = sprite.y - h * sprite.originY;
          const bottom = top + h;
          return { left, right, top, bottom };
        }

        getZoomForFraction(fraction) {
          if (!this.worldW || !this.worldH) return 1;
          const cam = this.cameras.main;
          return Math.min(
            (cam.width * fraction) / this.worldW,
            (cam.height * fraction) / this.worldH
          );
        }

        getZoomForHeight(height) {
          const cam = this.cameras.main;
          if (!cam || !height) return 1;
          return cam.height / height;
        }

        getZoomForRect(width, height) {
          const cam = this.cameras.main;
          if (!cam || !width || !height) return 1;
          return Math.min(cam.width / width, cam.height / height);
        }

        applyGameplayCamera() {
          if (!this.worldW || !this.worldH) return;
          const cam = this.cameras.main;
          if (!cam) return;
          cam.setBounds(0, 0, this.worldW, this.worldH);
          if (this.fixedBandActive) {
            cam.startFollow(this.player, true, 1, 0);
            cam.setZoom(this.getZoomForHeight(CAMERA_TARGET_VIEW_HEIGHT));
            cam.setScrollY(CAMERA_TARGET_VIEW_TOP);
          } else {
            cam.startFollow(this.player, true, 1, 1);
            cam.setZoom(this.getZoomForFraction(CAMERA_ZOOM_START_FRACTION));
          }
        }

        applyCutsceneCamera(animate = false) {
          if (!this.worldW || !this.worldH) return;
          const cam = this.cameras.main;
          const targetZoom = this.getZoomForRect(CUTSCENE_MUST_VIEW_WIDTH, CUTSCENE_MUST_VIEW_HEIGHT);
          const getScrollForZoom = (zoom) => {
            const viewW = cam.width / zoom;
            const viewH = cam.height / zoom;
            return {
              x: this.worldW - viewW,
              y: CUTSCENE_MUST_VIEW_TOP
            };
          };
          const targetScroll = getScrollForZoom(targetZoom);
          cam.stopFollow();
          cam.setBounds(targetScroll.x, targetScroll.y, cam.width / targetZoom, cam.height / targetZoom);
          if (!animate) {
            cam.setZoom(targetZoom);
            cam.setScroll(targetScroll.x, targetScroll.y);
            return;
          }
          if (this.zoomTween) this.zoomTween.stop();
          this.zoomTween = this.tweens.add({
            targets: cam,
            zoom: targetZoom,
            duration: CAMERA_ZOOM_EASE_MS,
            ease: 'Sine.easeInOut',
            onUpdate: () => {
              const scroll = getScrollForZoom(cam.zoom);
              cam.setBounds(scroll.x, scroll.y, cam.width / cam.zoom, cam.height / cam.zoom);
              cam.setScroll(scroll.x, scroll.y);
            }
          });
        }

        wrapPlayer() {
          const width = this.worldW || this.scale.width;
          const height = this.worldH || this.scale.height;
          if (this.player.x < 0) this.player.x = width;
          else if (this.player.x > width) this.player.x = 0;
          if (this.player.y < 0) this.player.y = height;
          else if (this.player.y > height) this.player.y = 0;
        }

        canStandAt(x, y) {
          const targetFoot = this.getFootPosition(x, y);
          if (this.blockedSet && this.blockedSet.has(`${targetFoot.x},${targetFoot.y}`)) return false;
          if (this.isInsideDogBounds(targetFoot.x, targetFoot.y)) return false;

          const radius = 10;
          const targetMin = this.domeMinDistance(targetFoot.x, targetFoot.y, radius);
          if (targetMin > radius) return true;

          const currentFoot = this.getFootPosition(this.player.x, this.player.y);
          const currentMin = this.domeMinDistance(currentFoot.x, currentFoot.y, radius);
          return targetMin >= currentMin - 0.25;
        }

        getFootPosition(x, y) {
          const frameH = this.player.frame ? this.player.frame.realHeight : FRAME_HEIGHT;
          const footX = Math.round(Phaser.Math.Clamp(x, 0, this.worldW - 1));
          const footY = Math.round(Phaser.Math.Clamp(y + (frameH * this.player.scaleY) / 2, 0, this.worldH - 1));
          return { x: footX, y: footY };
        }

        isDomeOpaqueAt(worldX, worldY) {
          const scale = this.dome ? this.dome.scaleX : 1;
          const localX = Math.floor((worldX - this.dome.x) / scale);
          const localY = Math.floor((worldY - this.dome.y) / scale);
          if (localX < 0 || localY < 0 || localX >= this.domeFrameW || localY >= this.domeFrameH) return false;
          const frameIndex = this.dome.frame ? this.dome.frame.index : 0;
          const cols = Math.max(1, Math.floor(this.domeW / this.domeFrameW));
          const baseX = (frameIndex % cols) * this.domeFrameW;
          const baseY = Math.floor(frameIndex / cols) * this.domeFrameH;
          const srcX = baseX + localX;
          const srcY = baseY + localY;
          if (srcX < 0 || srcX >= this.domeW || srcY < 0 || srcY >= this.domeH) return false;
          const idx = (srcY * this.domeW + srcX) * 4 + 3;
          return this.domeAlpha && this.domeAlpha[idx] > 0;
        }

        domeMinDistance(x, y, radius) {
          if (!this.dome || !this.domeTexture || !this.domeAlpha) return Infinity;
          const scale = this.dome.scaleX || 1;
          const localX = (x - this.dome.x) / scale;
          const localY = (y - this.dome.y) / scale;
          const r = radius / scale;
          const minX = Math.max(0, Math.floor(localX - r));
          const minY = Math.max(0, Math.floor(localY - r));
          const maxX = Math.min(this.domeFrameW - 1, Math.ceil(localX + r));
          const maxY = Math.min(this.domeFrameH - 1, Math.ceil(localY + r));
          const frameIndex = this.dome.frame ? this.dome.frame.index : 0;
          const cols = Math.max(1, Math.floor(this.domeW / this.domeFrameW));
          const baseX = (frameIndex % cols) * this.domeFrameW;
          const baseY = Math.floor(frameIndex / cols) * this.domeFrameH;
          let minDist2 = Infinity;
          for (let py = minY; py <= maxY; py++) {
            for (let px = minX; px <= maxX; px++) {
              const srcX = baseX + px;
              const srcY = baseY + py;
              if (srcX < 0 || srcX >= this.domeW || srcY < 0 || srcY >= this.domeH) continue;
              const idx = (srcY * this.domeW + srcX) * 4 + 3;
              if (this.domeAlpha[idx] <= 0) continue;
              const dx = (px - localX) * scale;
              const dy = (py - localY) * scale;
              const d2 = dx * dx + dy * dy;
              if (d2 < minDist2) minDist2 = d2;
            }
          }
          return Number.isFinite(minDist2) ? Math.sqrt(minDist2) : Infinity;
        }

        isTooCloseToDog(x, y, radius) {
          if (!this.dog) return false;
          const dx = x - this.dog.x;
          const dy = y - this.dog.y;
          return (dx * dx + dy * dy) <= (radius * radius);
        }

        cacheDomeAlpha(domeImage) {
          const canvas = document.createElement('canvas');
          canvas.width = domeImage.width;
          canvas.height = domeImage.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(domeImage, 0, 0);
          const data = ctx.getImageData(0, 0, domeImage.width, domeImage.height).data;
          return { data, w: domeImage.width, h: domeImage.height };
        }

        buildDomeAlphaCache() {
          const domeTex = this.textures.get(DOME_KEY);
          const breakTex = this.textures.get(DOME_BREAK_KEY);
          const heartTex = this.textures.get(HEART_KEY);
          if (domeTex && !this.domeAlphaCache[DOME_KEY]) {
            this.domeAlphaCache[DOME_KEY] = this.cacheDomeAlpha(domeTex.getSourceImage());
          }
          if (breakTex && !this.domeAlphaCache[DOME_BREAK_KEY]) {
            this.domeAlphaCache[DOME_BREAK_KEY] = this.cacheDomeAlpha(breakTex.getSourceImage());
          }
          if (heartTex && !this.domeAlphaCache[HEART_KEY]) {
            this.domeAlphaCache[HEART_KEY] = this.cacheDomeAlpha(heartTex.getSourceImage());
          }
          const breakingTex = this.textures.get(BREAKING_KEY);
          if (breakingTex && !this.domeAlphaCache[BREAKING_KEY]) {
            this.domeAlphaCache[BREAKING_KEY] = this.cacheDomeAlpha(breakingTex.getSourceImage());
          }
        }

        applyDomeAlphaCache(key) {
          const cached = this.domeAlphaCache[key];
          if (!cached) return;
          this.domeAlpha = cached.data;
          this.domeW = cached.w;
          this.domeH = cached.h;
        }

        cacheDogAlpha(dogImage) {
          const canvas = document.createElement('canvas');
          canvas.width = dogImage.width;
          canvas.height = dogImage.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(dogImage, 0, 0);
          const data = ctx.getImageData(0, 0, dogImage.width, dogImage.height).data;
          this.dogAlpha = data;
          this.dogW = dogImage.width;
          this.dogH = dogImage.height;
        }

        isInsideDogBounds(worldX, worldY) {
          if (!this.dog) return false;
          const bounds = this.dog.getBounds();
          const pad = 40;
          const expanded = new Phaser.Geom.Rectangle(
            bounds.x - pad,
            bounds.y - pad,
            bounds.width + pad * 2,
            bounds.height + pad * 2
          );
          return expanded.contains(worldX, worldY);
        }

        createDogPrompt() {
          const titleText = this.add.text(0, 0, 'WHO ARE YOU', {
            fontFamily: 'IBM Plex Sans, sans-serif',
            fontSize: '18px',
            color: '#2a2300',
            fontStyle: 'bold'
          }).setOrigin(0.5, 0.5);

          const titleBg = this.add.graphics();
          titleBg.fillStyle(0xffe08a, 1);
          titleBg.lineStyle(1, 0xfff0bf, 1);
          titleBg.fillRoundedRect(-90, -14, 180, 28, 10);
          titleBg.strokeRoundedRect(-90, -14, 180, 28, 10);

          const makeGlassButton = (label, x, y, fillHex, strokeHex, textColor, onClick) => {
            const width = 130;
            const height = 32;
            const bg = this.add.graphics();
            bg.fillStyle(fillHex, 1);
            bg.lineStyle(1, strokeHex, 1);
            bg.fillRoundedRect(-width / 2, -height / 2, width, height, 10);
            bg.strokeRoundedRect(-width / 2, -height / 2, width, height, 10);

            const text = this.add.text(0, 0, label, {
              fontFamily: 'IBM Plex Sans, sans-serif',
              fontSize: '14px',
              color: textColor,
              fontStyle: 'bold'
            }).setOrigin(0.5, 0.5);

            const container = this.add.container(x, y, [bg, text]);
            container.setSize(width, height);
            container.width = width;
            container.height = height;
            container._hitW = width;
            container._hitH = height;
            container.setInteractive(
              new Phaser.Geom.Rectangle(-width / 2, -height / 2, width, height),
              Phaser.Geom.Rectangle.Contains
            );
            container.on('pointerdown', () => {
              if (!this.promptClicksEnabled) return;
              onClick();
            });
            container.on('pointerover', () => container.setScale(1.02));
            container.on('pointerout', () => container.setScale(1));
            return container;
          };

          const btnGrishma = makeGlassButton(
            'GRISHMA',
            -80,
            34,
            0x4ccf8c,
            0x6ee3ad,
            '#0b2a1d',
            () => {
              this.startCutscene();
            }
          );
          this.btnGrishma = btnGrishma;
          const btnElse = makeGlassButton(
            'SOMEONE ELSE',
            80,
            34,
            0xd85b5b,
            0xef8b8b,
            '#2b0f0f',
            () => {
              console.log('WHO ARE YOU: SOMEONE ELSE');
              this.startMonsterHoverAudio();
              this.startDogAngry();
            }
          );
          this.btnElse = btnElse;

          this.promptContainer = this.add.container(0, 0, [titleBg, titleText, btnGrishma, btnElse]);
          this.promptContainer.setDepth(6);
        }

        updateDogPrompt() {
          if (!this.promptContainer || !this.dog) return;
          this.promptContainer.setPosition(this.dog.x, this.dog.y - this.promptOffsetY);
          this.updateDogHover();
        }

        handleGlobalPointerDown(pointer) {
          if (this.cutsceneActive || !this.btnGrishma || !this.startClicked) return;
          if (this.loaderEl && this.loaderEl.style.display !== 'none') return;
          if (!this.promptClicksEnabled) return;
          this.startBgm();
          const world = pointer.positionToCamera(this.cameras.main);
          if (this.isPointerOverButton(this.btnGrishma, world)) {
            this.startCutscene();
          }
        }

        setControlsEnabled(enabled) {
          if (this.input) this.input.enabled = enabled;
          if (this.input && this.input.keyboard) this.input.keyboard.enabled = enabled;
          if (this.cursors) this.cursors.enabled = enabled;
          if (this.wasd) {
            Object.values(this.wasd).forEach((key) => {
              key.enabled = enabled;
            });
          }
        }


        setDomeState(state) {
          if (!this.dome) return;
          if (state === 'break') {
            this.dome.setTexture(DOME_BREAK_KEY, 0);
            this.domeFrameW = DOME_BREAK_W;
            this.domeFrameH = DOME_BREAK_H;
            this.dome.x = this.worldW - this.domeFrameW * DOME_SCALE;
            this.dome.y = 200;
            this.domeTexture = this.textures.get(DOME_BREAK_KEY);
            this.applyDomeAlphaCache(DOME_BREAK_KEY);
            this.dome.play('dome-break', true);
          } else if (state === 'heart') {
            this.dome.setTexture(HEART_KEY, 0);
            this.domeFrameW = HEART_W;
            this.domeFrameH = HEART_H;
            this.dome.x = this.worldW - this.domeFrameW * DOME_SCALE;
            this.dome.y = 200;
            this.domeTexture = this.textures.get(HEART_KEY);
            this.applyDomeAlphaCache(HEART_KEY);
            this.dome.play('heart-beat', true);
          }
        }

        updateDogHover() {
          if (this.dogLocked) return;
          if (!this.promptClicksEnabled) return;
          if (!this.btnElse) return;
          const pointer = this.input.activePointer;
          const world = pointer.positionToCamera(this.cameras.main);
          const isOver = this.isPointerOverButton(this.btnElse, world);
          if (isOver && !this.dogHoverElse) {
            this.dogHoverElse = true;
            this.startMonsterHoverAudio();
            this.startDogAngry();
          } else if (!isOver && this.dogHoverElse) {
            this.dogHoverElse = false;
            this.stopMonsterHoverAudio();
            if (this.dogState === 'stay') {
              this.setDogState('angry-back');
            }
          }
        }

        setDogState(state) {
          if (!this.dog || this.dogState === state) return;
          this.dogState = state;
          if (state === 'idle') {
            this.dog.setTexture(DOG_IDLE_KEY, 0);
            this.dog.play('dog-idle');
          } else if (state === 'angry') {
            this.dog.setTexture(DOG_ANGRY_KEY, 0);
            this.dog.play('dog-angry');
          } else if (state === 'angry-back') {
            this.dog.setTexture(DOG_ANGRY_KEY, DOG_ANGRY_COUNT - 1);
            this.dog.play('dog-angry-back');
          } else if (state === 'stay') {
            this.dog.setTexture(DOG_STAY_KEY, 0);
            this.dog.play('dog-stay');
          } else if (state === 'sleep-start') {
            this.dog.setTexture(DOG_SLEEP_START_KEY, 0);
            this.dog.play('dog-sleep-start');
          } else if (state === 'sleep-loop') {
            this.dog.setTexture(DOG_SLEEP_LOOP_KEY, 0);
            this.dog.play('dog-sleep-loop');
          }
        }

        startDogAngry() {
          if (this.dogLocked) return;
          if (this.dogState === 'idle') {
            this.setDogState('angry');
          }
        }

        startDogSleep() {
          if (!this.dog || this.dogLocked) return;
          this.dogLocked = true;
          this.dogHoverElse = false;
          this.setDogState('sleep-start');
        }

        initLoader() {
          if (!this.loaderEl) return;
          this.loaderEl.style.display = 'flex';
          if (this.gameTitleEl) {
            this.gameTitleEl.classList.add('visible');
          }
          if (this.loaderImage) {
            this.loaderImage.src = this.loadingComplete
              ? 'assets/loading complete.png'
              : 'assets/loader page.png';
          }
          if (this.startBtn) {
            this.startBtn.style.display = this.loadingComplete ? 'inline-flex' : 'none';
            if (!this.startBtn._startBound) {
              this.startBtn._startBound = true;
              this.startBtn.addEventListener('click', () => {
                this.startClicked = true;
                this.startBgm();
                this.tryHideLoader();
              });
            }
          }
        }

        tryHideLoader() {
          if (!this.loaderEl) return;
          if (this.loadingComplete && this.bgmStarted && this.startClicked) {
            this.loaderEl.style.display = 'none';
            if (this.gameTitleEl) {
              this.gameTitleEl.classList.add('visible');
            }
            this.setControlsEnabled(true);
          }
        }

        startBgm() {
          if (this.bgmStarted) return;
          if (!this.cache.audio || !this.cache.audio.exists(BGM_KEY)) return;
          if (!this.bgm) {
            this.bgm = this.sound.add(BGM_KEY, { loop: true, volume: 0.1 });
          }
          this.sound.mute = false;
          this.sound.volume = 1;
          const ctx = this.sound.context;
          if (ctx && ctx.state && ctx.state !== 'running') {
            ctx.resume().then(() => this.startBgm()).catch(() => {});
            return;
          }
          if (this.sound.locked) {
            this.sound.once('unlocked', () => this.startBgm());
            return;
          }
          this.bgm.once('play', () => {
            this.bgmStarted = true;
            this.tryHideLoader();
          });
          this.bgm.play();
        }

        isPointerOverButton(btn, world) {
          if (!btn) return false;
          const m = btn.getWorldTransformMatrix();
          const halfW = (btn._hitW || btn.width || 0) * (btn.scaleX || 1) / 2;
          const halfH = (btn._hitH || btn.height || 0) * (btn.scaleY || 1) / 2;
          return (
            world.x >= (m.tx - halfW) &&
            world.x <= (m.tx + halfW) &&
            world.y >= (m.ty - halfH) &&
            world.y <= (m.ty + halfH)
          );
        }

        startCutscene() {
          if (this.cutsceneActive) return;
          console.log('WHO ARE YOU: GRISHMA');
          this.cutsceneActive = true;
          this.fixedBandActive = true;
          this.cutsceneMoveDone = false;
          this.cutsceneDomeDone = false;
          this.cutsceneGuyDone = !this.guy;
          const targetX = Math.max(0, this.worldW - CUTSCENE_TARGET_RIGHT);
          const targetY = Math.max(0, Math.min(this.worldH - 1, CUTSCENE_TARGET_TOP));
          this.cutsceneTarget = { x: targetX, y: targetY };
          this.startGuyWalkIn();
          this.applyCutsceneCamera(true);
          this.setControlsEnabled(false);
          if (this.promptContainer) this.promptContainer.setVisible(false);
          this.stopWalkSfx();
          this.stopMonsterHoverAudio();
          this.setDomeState('break');
          this.startDogSleep();
          this.playDomeCrumble();
        }

        endCutscene() {
          this.cutsceneActive = false;
          this.cutsceneTarget = null;
          this.setControlsEnabled(true);
        }

        tryEndCutscene() {
          if (this.cutsceneActive && this.cutsceneMoveDone && this.cutsceneDomeDone && this.cutsceneGuyDone) {
            this.endCutscene();
          }
        }

        updateCutscene(delta) {
          if (!this.cutsceneTarget || !this.player) return;
          this.updateGuyCutscene(delta);
          this.updateGuyBubble();
          const dx = this.cutsceneTarget.x - this.player.x;
          const dy = this.cutsceneTarget.y - this.player.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= 2) {
            this.player.x = this.cutsceneTarget.x;
            this.player.y = this.cutsceneTarget.y;
            this.cutsceneMoveDone = true;
            this.player.setTexture(SEE_PROPOSAL_KEY, 0);
            this.player.setFlipX(false);
            this.player.anims.stop();
            this.playerPoseLocked = true;
            this.updateWalkSfx(false);
            this.tryEndCutscene();
            return;
          }
          const dt = Math.min(delta / 1000, 1 / 30);
          const step = Math.min(CUTSCENE_WALK_SPEED * dt, dist);
          const nx = dx / dist;
          const ny = dy / dist;
          this.player.x += nx * step;
          this.player.y += ny * step;
          if (nx !== 0) this.facing = Math.sign(nx);
          if (ny !== 0) this.lastVertical = Math.sign(ny);
          this.applyPlayerAnimation(nx, ny);
          this.updateWalkSfx(true);
        }

        startGuyWalkIn() {
          if (!this.guy) return;
          const startX = this.worldW - GUY_START_RIGHT;
          const targetX = Math.max(0, this.worldW - GUY_TARGET_RIGHT);
          this.guy.x = startX;
          this.guy.y = GUY_Y;
          this.guyTargetX = targetX;
          this.guyMoving = true;
          this.guy.setVisible(true);
          this.guy.play('guy-walk');
        }

        updateGuyCutscene(delta) {
          if (!this.guy) {
            this.cutsceneGuyDone = true;
            return;
          }
          if (!this.guyMoving) return;
          const dx = this.guyTargetX - this.guy.x;
          if (Math.abs(dx) <= 2) {
            this.guy.x = this.guyTargetX;
            this.guyMoving = false;
            this.cutsceneGuyDone = true;
            this.guy.setTexture(GUY_PROPOSE_KEY, 0);
            this.guy.play('guy-propose');
            if (!this.playerShockScheduled) {
              this.playerShockScheduled = true;
              const delay = (GUY_PROPOSE_COUNT / GUY_PROPOSE_FRAME_RATE) * 500;
              this.time.delayedCall(delay, () => {
                if (!this.player || !this.playerPoseLocked) return;
                this.player.setTexture(SHOCKED_KEY, 0);
                this.player.setFlipX(false);
                this.player.play('shocked');
              });
            }
            return;
          }
          const dt = Math.min(delta / 1000, 1 / 30);
          const step = Math.min(GUY_SPEED * dt, Math.abs(dx));
          this.guy.x += Math.sign(dx) * step;
        }

        updateGuyBubble() {
          if (!this.guyBubble || !this.guy || !this.guy.visible) return;
          if (this.choiceLocked) {
            return;
          }
          const current = this.guy.anims && this.guy.anims.currentAnim
            ? this.guy.anims.currentAnim.key
            : '';
          if (current !== 'guy-wait' && this.guy.texture.key !== GUY_NO_KEY) {
            this.guyBubble.style.display = 'none';
            return;
          }
          const cam = this.cameras.main;
          const screenX = (this.guy.x - cam.worldView.x) * cam.zoom;
          const screenY = (this.guy.y - cam.worldView.y) * cam.zoom;
          const headOffset = (GUY_FRAME_H * this.guy.scaleY) / 2 + 24;
          this.guyBubble.style.display = 'block';
          this.guyBubble.style.transform = `translate(-50%, -100%)`;
          this.guyBubble.style.left = `${screenX + 150}px`;
          this.guyBubble.style.top = `${screenY - headOffset + 50}px`;
        }

        updateGirlButtons() {
          if (!this.girlButtons || !this.player || !this.guy) return;
          if (this.choiceLocked) {
            return;
          }
          const guyAnim = this.guy.anims && this.guy.anims.currentAnim
            ? this.guy.anims.currentAnim.key
            : '';
          const guyKey = this.guy.texture ? this.guy.texture.key : '';
          const guyReady =
            guyAnim === 'guy-wait' ||
            guyKey === GUY_NO_KEY ||
            guyKey === GUY_YES_KEY ||
            guyKey === GUY_PROPOSE_REV_SHEET_KEY;
          if (!this.playerPoseLocked || !guyReady) {
            this.girlButtons.style.display = 'none';
            return;
          }
          const cam = this.cameras.main;
          const screenX = (this.player.x - cam.worldView.x) * cam.zoom;
          const screenY = (this.player.y - cam.worldView.y) * cam.zoom;
          const frameH = this.player.frame ? this.player.frame.realHeight : FRAME_HEIGHT;
          const headOffset = (frameH * this.player.scaleY) / 2 + 22;
          this.girlButtons.style.display = 'flex';
          this.girlButtons.style.left = `${screenX}px`;
          this.girlButtons.style.top = `${screenY - headOffset}px`;
        }

        startNoExit() {
          if (this.noExitActive) return;
          this.noExitActive = true;
          this.noExitPlayerDone = false;
          this.noExitGuyDone = false;
          const guyTargetX = Math.max(0, this.worldW - NO_EXIT_GUY_RIGHT);
          const guyTargetY = Math.max(0, Math.min(this.worldH - 1, NO_EXIT_GUY_TOP));
          const playerTargetX = this.worldW - NO_EXIT_PLAYER_RIGHT;
          const playerTargetY = Math.max(0, Math.min(this.worldH - 1, NO_EXIT_PLAYER_TOP));
          this.noExitTargets = {
            guy: { x: guyTargetX, y: guyTargetY },
            player: { x: playerTargetX, y: playerTargetY }
          };
          if (this.guy) {
            this.guy.setTexture(GUY_SAD_KEY, 0);
            this.guy.play('guy-sad-walk');
          }
        }

        updateNoExit(delta) {
          if (!this.noExitTargets || !this.player) return;
          const dt = Math.min(delta / 1000, 1 / 30);
          if (this.guy && !this.noExitGuyDone) {
            const dx = this.noExitTargets.guy.x - this.guy.x;
            const dy = this.noExitTargets.guy.y - this.guy.y;
            const dist = Math.hypot(dx, dy);
            if (dist <= 2) {
              this.guy.x = this.noExitTargets.guy.x;
              this.guy.y = this.noExitTargets.guy.y;
              this.noExitGuyDone = true;
              this.guy.anims.stop();
            } else {
              const step = Math.min(NO_EXIT_GUY_SPEED * dt, dist);
              this.guy.x += (dx / dist) * step;
              this.guy.y += (dy / dist) * step;
            }
          }

          if (!this.noExitPlayerDone) {
            const dx = this.noExitTargets.player.x - this.player.x;
            const dy = this.noExitTargets.player.y - this.player.y;
            const dist = Math.hypot(dx, dy);
            if (dist <= 2) {
              this.player.x = this.noExitTargets.player.x;
              this.player.y = this.noExitTargets.player.y;
              this.noExitPlayerDone = true;
              this.player.anims.stop();
              this.updateWalkSfx(false);
            } else {
              const step = Math.min(NO_EXIT_PLAYER_SPEED * dt, dist);
              const nx = dx / dist;
              const ny = dy / dist;
              this.player.x += nx * step;
              this.player.y += ny * step;
              if (nx !== 0) this.facing = Math.sign(nx);
              if (ny !== 0) this.lastVertical = Math.sign(ny);
              this.applyPlayerAnimation(nx, ny);
              this.updateWalkSfx(true);
            }
          }
          if (this.noExitGuyDone && this.noExitPlayerDone) {
            this.showEndOverlay();
          }
        }

        bindGirlButtonHover() {
          if (!this.btnNo || !this.btnYes) return;
          this.btnYes.addEventListener('mouseenter', () => {
            if (this.choiceLocked) return;
            if (this.guy && this.guy.anims) {
              this.guy.setTexture(GUY_YES_KEY, 0);
              this.guy.anims.stop();
            }
            this.setHeartHoverBoost(true);
          });
          this.btnYes.addEventListener('mouseleave', () => {
            if (this.choiceLocked) return;
            if (this.guy && this.guy.anims) {
              this.guy.setTexture(GUY_WAIT_KEY, 0);
              this.guy.play('guy-wait');
            }
            this.setHeartHoverBoost(false);
          });
          this.btnYes.addEventListener('pointerdown', () => {
            if (this.choiceLocked) return;
            this.choiceLocked = true;
            this.yesChoiceActive = true;
            this.noChoiceActive = false;
            if (this.guy && this.guy.anims) {
              this.yesReverseStartX = this.guy.x;
              this.guy.setTexture(GUY_PROPOSE_REV_SHEET_KEY, GUY_PROPOSE_COUNT - 1);
              this.guy.play(GUY_PROPOSE_REV_KEY);
            }
            if (this.guyBubble) this.burnAndHide(this.guyBubble);
            if (this.girlButtons) this.burnAndHide(this.girlButtons);
            this.setHeartHoverBoost(false);
          });
          this.btnNo.addEventListener('mouseenter', () => {
            if (this.choiceLocked) return;
            this.btnNo.src = 'buttons/no hover.png';
            this.noHovering = true;
            if (this.guy && this.guy.anims) {
              this.guy.setTexture(GUY_NO_KEY, 0);
              this.guy.anims.stop();
            }
            if (this.dome) {
              this.dome.setTexture(BREAKING_KEY, 0);
              this.domeFrameW = BREAKING_W;
              this.domeFrameH = BREAKING_H;
              this.domeTexture = this.textures.get(BREAKING_KEY);
              this.applyDomeAlphaCache(BREAKING_KEY);
              this.dome.play('breaking', true);
            }
            this.setHeartHoverBoost(true);
          });
          this.btnNo.addEventListener('mouseleave', () => {
            if (this.choiceLocked) return;
            this.btnNo.src = 'buttons/no button.png';
            this.noHovering = false;
            if (this.guy && this.guy.anims) {
              this.guy.setTexture(GUY_WAIT_KEY, 0);
              this.guy.play('guy-wait');
            }
            if (this.dome) {
              this.dome.setTexture(HEART_KEY, 0);
              this.domeFrameW = HEART_W;
              this.domeFrameH = HEART_H;
              this.domeTexture = this.textures.get(HEART_KEY);
              this.applyDomeAlphaCache(HEART_KEY);
              this.dome.play('heart-beat', true);
            }
            this.setHeartHoverBoost(false);
          });
          this.btnNo.addEventListener('pointerdown', () => {
            if (this.choiceLocked) return;
            this.choiceLocked = true;
            this.noChoiceActive = true;
            this.yesChoiceActive = false;
            this.noHovering = false;
            if (this.guy && this.guy.anims) {
              this.guy.setTexture(GUY_PROPOSE_REV_SHEET_KEY, GUY_PROPOSE_COUNT - 1);
              this.guy.play(GUY_PROPOSE_REV_KEY);
            }
            if (this.guyBubble) this.burnAndHide(this.guyBubble);
            if (this.girlButtons) this.burnAndHide(this.girlButtons);
            this.setHeartHoverBoost(false);
          });
        }

        burnAndHide(el) {
          if (!el) return;
          el.style.pointerEvents = 'none';
          el.classList.add('burn-out');
          const onEnd = () => {
            el.style.display = 'none';
            el.classList.remove('burn-out');
            el.removeEventListener('animationend', onEnd);
          };
          el.addEventListener('animationend', onEnd);
        }

        applyPlayerAnimation(inputX, inputY) {
          if (!this.player) return;
          const current = this.player.anims.currentAnim ? this.player.anims.currentAnim.key : '';
          if (inputX !== 0 || inputY !== 0) {
            this.player.setFlipX(this.facing < 0);
            if (inputX !== 0 && inputY < 0) {
              if (this.player.texture.key !== DIAG_KEY) {
                this.player.setTexture(DIAG_KEY, 0);
              }
              if (current !== 'walk-diag') this.player.play('walk-diag');
            } else if (inputX !== 0) {
              if (this.player.texture.key !== SHEET_KEY) {
                this.player.setTexture(SHEET_KEY, 0);
              }
              if (current !== 'walk') this.player.play('walk');
            } else if (inputY < 0) {
              if (this.player.texture.key !== UP_KEY) {
                this.player.setTexture(UP_KEY, 0);
              }
              if (current !== 'walk-up') this.player.play('walk-up');
            } else if (inputY > 0) {
              if (this.player.texture.key !== DOWN_KEY) {
                this.player.setTexture(DOWN_KEY, 0);
              }
              if (current !== 'walk-down') this.player.play('walk-down');
            }
          } else {
            this.player.setFlipX(this.facing < 0);
            if (this.lastVertical < 0) {
              if (this.player.texture.key !== IDLE_BACK_KEY) {
                this.player.setTexture(IDLE_BACK_KEY, 0);
              }
              if (current !== 'idle-back') this.player.play('idle-back');
            } else {
              if (this.player.texture.key !== IDLE_KEY) {
                this.player.setTexture(IDLE_KEY, 0);
              }
              if (current !== 'idle') this.player.play('idle');
            }
          }
        }

        playDomeCrumble() {
          if (!this.cache.audio || !this.cache.audio.exists(SFX_DOME_KEY)) return;
          if (!this.domeSfx) {
            this.domeSfx = this.sound.add(SFX_DOME_KEY, { loop: false, volume: 1.0 });
          }
          this.domeSfx.play();
        }

        startHeartBeat() {
          if (!this.cache.audio || !this.cache.audio.exists(SFX_HEART_KEY)) return;
          if (!this.heartSfx) {
            this.heartSfx = this.sound.add(SFX_HEART_KEY, { loop: true, volume: 0.9 });
          }
          this.heartSfx.setRate(HEART_AUDIO_RATE_NORMAL);
          if (!this.heartSfx.isPlaying) {
            this.heartSfx.play();
          }
        }

        setHeartHoverBoost(isBoosted) {
          const anim = this.anims.get('heart-beat');
          if (anim) {
            anim.frameRate = isBoosted ? HEART_RATE_HOVER : HEART_RATE_NORMAL;
          }
          if (this.dome && this.dome.anims && this.dome.anims.currentAnim && this.dome.anims.currentAnim.key === 'heart-beat') {
            this.dome.anims.timeScale = (isBoosted ? HEART_RATE_HOVER : HEART_RATE_NORMAL) / HEART_RATE_NORMAL;
          }
          if (this.heartSfx) {
            this.heartSfx.setRate(isBoosted ? HEART_AUDIO_RATE_HOVER : HEART_AUDIO_RATE_NORMAL);
          }
        }

        startMonsterHoverAudio() {
          this.monsterHovering = true;
          if (!this.cache.audio ||
              !this.cache.audio.exists(SFX_ROAR_KEY) ||
              !this.cache.audio.exists(SFX_GROWL_KEY)) {
            return;
          }
          if (this.sound.locked) {
            if (!this.monsterUnlockQueued) {
              this.monsterUnlockQueued = true;
              this.sound.once('unlocked', () => {
                this.monsterUnlockQueued = false;
                if (this.monsterHovering) this.startMonsterHoverAudio();
              });
            }
            return;
          }
          if (!this.monsterRoar) {
            this.monsterRoar = this.sound.add(SFX_ROAR_KEY, { loop: false, volume: 1.0 });
          }
          if (!this.monsterGrowl) {
            this.monsterGrowl = this.sound.add(SFX_GROWL_KEY, { loop: true, volume: 0.9 });
          }
          if (this.monsterGrowl.isPlaying) this.monsterGrowl.stop();
          if (this.monsterRoar.isPlaying) this.monsterRoar.stop();
          this.monsterRoar.once('complete', () => {
            if (this.monsterHovering) this.startMonsterGrowl();
          });
          this.monsterRoar.play();
        }

        startMonsterGrowl() {
          if (!this.monsterHovering || !this.monsterGrowl) return;
          if (!this.monsterGrowl.isPlaying) {
            this.monsterGrowl.play();
          }
        }

        stopMonsterHoverAudio() {
          this.monsterHovering = false;
          if (this.monsterRoar && this.monsterRoar.isPlaying) this.monsterRoar.stop();
          if (this.monsterGrowl && this.monsterGrowl.isPlaying) this.monsterGrowl.stop();
        }

        updateWalkSfx(isMoving) {
          if (!isMoving) {
            this.stopWalkSfx();
            return;
          }
          this.startWalkSfx();
        }

        updateGuyWalkSfx() {
          if (!this.guy || !this.guy.visible || !this.guy.anims || !this.guy.anims.currentAnim) {
            this.stopGuyWalkSfx();
            return;
          }
          const isWalking =
            (this.guy.anims.currentAnim.key === 'guy-walk' ||
              this.guy.anims.currentAnim.key === 'guy-sad-walk') &&
            this.guy.anims.isPlaying;
          if (isWalking) {
            this.startGuyWalkSfx();
          } else {
            this.stopGuyWalkSfx();
          }
        }

        startWalkSfx() {
          if (!this.cache.audio || !this.cache.audio.exists(SFX_WALK_KEY)) return;
          if (this.sound.locked) {
            if (!this.walkSfxQueued) {
              this.walkSfxQueued = true;
              this.sound.once('unlocked', () => {
                this.walkSfxQueued = false;
                this.startWalkSfx();
              });
            }
            return;
          }
          if (!this.walkSfx) {
            this.walkSfx = this.sound.add(SFX_WALK_KEY, { loop: true, volume: 1.0 });
          }
          if (!this.walkSfx.isPlaying) {
            this.walkSfx.play();
          }
        }

        stopWalkSfx() {
          if (this.walkSfx && this.walkSfx.isPlaying) {
            this.walkSfx.stop();
          }
        }

        startGuyWalkSfx() {
          if (!this.cache.audio || !this.cache.audio.exists(SFX_GUY_WALK_KEY)) return;
          if (this.sound.locked) {
            if (!this.guyWalkQueued) {
              this.guyWalkQueued = true;
              this.sound.once('unlocked', () => {
                this.guyWalkQueued = false;
                this.startGuyWalkSfx();
              });
            }
            return;
          }
          if (!this.guyWalkSfx) {
            this.guyWalkSfx = this.sound.add(SFX_GUY_WALK_KEY, { loop: true, volume: 1.0 });
          }
          if (!this.guyWalkSfx.isPlaying) {
            this.guyWalkSfx.play();
          }
        }

        stopGuyWalkSfx() {
          if (this.guyWalkSfx && this.guyWalkSfx.isPlaying) {
            this.guyWalkSfx.stop();
          }
        }

        showEndOverlay() {
          if (this.endOverlayShown || !this.endOverlay) return;
          this.endOverlayShown = true;
          this.stopAllAudio();
          this.time.delayedCall(4000, () => {
            if (!this.endOverlay) return;
            this.endOverlay.setVisible(true);
            this.endOverlay.setAlpha(0);
            this.tweens.add({
              targets: this.endOverlay,
              alpha: 1,
              duration: 400,
              ease: 'Sine.easeOut'
            });
            if (this.endTextEl) {
              this.endTextEl.textContent = this.noChoiceActive ? 'GAME OVER' : 'YOU WIN!';
              this.endTextEl.classList.add('visible');
            }
          });
        }

        stopAllAudio() {
          const sounds = [
            this.bgm,
            this.domeSfx,
            this.heartSfx,
            this.monsterRoar,
            this.monsterGrowl,
            this.walkSfx,
            this.guyWalkSfx
          ];
          sounds.forEach((snd) => {
            if (snd && snd.isPlaying) snd.stop();
          });
          if (this.sound) {
            this.sound.stopAll();
          }
        }

        isOnStairs(set, x, y) {
          if (!set) return false;
          const r = this.stairsDetectRadius;
          for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
              if (set.has(`${x + dx},${y + dy}`)) return true;
            }
          }
          return false;
        }
      }

      new Phaser.Game({
        type: Phaser.CANVAS,
        parent: 'game',
        backgroundColor: '#0f1118',
        pixelArt: false,
        roundPixels: false,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        render: {
          antialias: true,
          antialiasGL: true
        },
        scale: {
          mode: Phaser.Scale.RESIZE,
          width: window.innerWidth,
          height: window.innerHeight
        },
        scene: WalkScene
      });
    })();
  </script>
</body>
</html>
